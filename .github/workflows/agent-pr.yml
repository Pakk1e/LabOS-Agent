name: Open agent branch pull request

on:
  push:
    branches:
      - "agent/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    if: github.actor == 'Pakk1e'
    runs-on: ubuntu-latest
    steps:
      - name: Open or reuse pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if gh pr view "$BRANCH" --repo "$REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh pr create             --repo "$REPOSITORY"             --base main             --head "$BRANCH"             --title "LabOS agent: $BRANCH"             --body "Automated pull request for a validated LabOS-Agent branch. Review CI and changes before merging."

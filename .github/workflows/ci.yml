name: LabOS-Agent CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

concurrency:
  group: labos-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/test_*.py; do
            if [[ "$test_file" == "tests/test_web.py" ]]; then
              continue
            fi
            echo "::group::pytest $test_file"
            timeout --signal=TERM --kill-after=10s 90s               python -m pytest -vv --durations=20 --timeout=30 "$test_file"
            echo "::endgroup::"
          done

  web-tests:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Non-browser web tests
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 90s             python -m pytest -vv --durations=20 --timeout=30 tests/test_web.py               -k 'not lifecycle_ui_browser_flow and not full_lifecycle_browser_api_flow'

  browser-tests:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install browser
        timeout-minutes: 4
        run: python -m playwright install --with-deps chromium
      - name: Browser integration tests
        run: python -m pytest -vv tests/test_web.py -k 'lifecycle_ui_browser_flow or full_lifecycle_browser_api_flow'

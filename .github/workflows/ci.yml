name: LabOS-Agent CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

concurrency:
  group: labos-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -vv --durations=20 --timeout=30 -k 'not lifecycle_ui_browser_flow and not full_lifecycle_browser_api_flow'

  browser-tests:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install browser
        timeout-minutes: 4
        run: python -m playwright install --with-deps chromium
      - name: Browser integration tests
        run: python -m pytest -vv tests/test_web.py -k 'lifecycle_ui_browser_flow or full_lifecycle_browser_api_flow'

name: LabOS-Agent CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

concurrency:
  group: labos-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s \
            python -m pytest -vv --durations=20 --timeout=30 \
              -k 'not lifecycle_ui_browser_flow and not full_lifecycle_browser_api_flow'

  browser-tests:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install browser
        timeout-minutes: 2
        run: python -m playwright install chromium
      - name: Browser integration tests
        run: python -m pytest -vv tests/test_web.py -k 'lifecycle_ui_browser_flow or full_lifecycle_browser_api_flow'

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab OS</title>
<style>
:root{color-scheme:dark;--bg:#0b0e13;--panel:#121720;--panel2:#171d28;--border:#27303d;--text:#edf2f7;--muted:#8d99a8;--accent:#8ab4ff;--good:#55d187;--warn:#e7b95b;--bad:#ef6b73}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:8px;padding:9px 13px}button:hover{border-color:#445267}button.primary{background:var(--accent);color:#07101f;border-color:var(--accent);font-weight:700}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{border-right:1px solid var(--border);background:#0e131b;padding:22px 16px}.brand{font-size:20px;font-weight:800;margin:0 8px 25px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:3px}.project{padding:12px;border-radius:10px;margin:5px 0;border:1px solid transparent}.project:hover{background:var(--panel)}.project.active{background:var(--panel2);border-color:var(--border)}.project-name{font-weight:700}.project-meta{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#596474;margin-right:7px}.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
main{padding:30px 34px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.title{font-size:28px;font-weight:800;margin:3px 0}.actions{display:flex;gap:8px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:18px}.hero{grid-column:span 8}.statuscard{grid-column:span 4}.wide{grid-column:span 12}.card h2,.card h3{margin:0 0 14px}.repo{color:var(--muted)}.bigstate{font-size:24px;font-weight:800;margin:8px 0 4px}.badge{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:4px 9px;font-size:12px}.badge.good{color:var(--good);border-color:#245f3d}.badge.warn{color:var(--warn);border-color:#6d5422}.badge.bad{color:var(--bad);border-color:#673138}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--panel2);padding:12px;border-radius:9px}.stat label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.stat strong{display:block;margin-top:5px}.timeline{display:grid;gap:0}.event{display:grid;grid-template-columns:100px 20px 1fr;padding:9px 0;border-bottom:1px solid #1d2430}.event:last-child{border:0}.event time{color:var(--muted);font-variant-numeric:tabular-nums}.event .mark{color:var(--good)}.muted{color:var(--muted)}.empty{padding:25px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{width:min(620px,100%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px}.form{display:grid;gap:13px}.form label{display:grid;gap:6px;color:var(--muted);font-size:12px}.form input,.form textarea{width:100%;background:#0c1118;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px}.form textarea{min-height:75px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.hero,.statuscard,.wide{grid-column:span 12}.stats{grid-template-columns:repeat(2,1fr)}main{padding:20px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">LAB OS<small>Engineering control plane</small></div>
  <button class="primary" style="width:100%;margin-bottom:14px" onclick="openCreate()">＋ New Project</button>
  <div id="projectList"></div>
</aside>
<main>
  <div class="top">
    <div><div class="eyebrow">Workspace</div><div class="title" id="pageTitle">Lab OS</div><div class="repo" id="pageRepo">Select a project</div></div>
    <div class="actions"><button onclick="refresh()">↻ Refresh</button><button id="startBtn" class="primary" onclick="toggleSupervisor()" disabled>▶ Start Supervisor</button></div>
  </div>
  <div id="content"><div class="empty">Loading projects…</div></div>
</main>
</div>
<div class="modal" id="modal">
<div class="dialog">
<h2 style="margin-top:0">Create Project</h2>
<form class="form" onsubmit="createProject(event)">
<label>Name<input name="name" required placeholder="weather"></label>
<label>GitHub repository<input name="repository" required placeholder="Pakk1e/VilaPro-Weather"></label>
<label>Local repository path<input name="project_root" required placeholder="/home/park-pro/VilaPro-Weather"></label>
<label>ChatGPT Project name<input name="project_name" placeholder="Vadovsky Tech — Weather"></label>
<label>ChatGPT Project URL<input name="project_url" placeholder="https://chatgpt.com/..."></label>
<label>Continuation message<textarea name="continuation_message" placeholder="Continue the project from the current state."></textarea></label>
<div class="dialog-actions"><button type="button" onclick="closeCreate()">Cancel</button><button class="primary">Create Project</button></div>
</form>
</div>
</div>
<script>
let projects=[],selected=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function statusClass(p){if(p.ci_conclusion==='failure'||p.ci_status==='FAILED')return'bad';if(p.running||p.ci_status==='IN_PROGRESS'||p.ci_status==='QUEUED')return'warn';if(p.ci_conclusion==='success'||p.ci_status==='PASSED')return'good';return''}
function renderList(){document.getElementById('projectList').innerHTML=projects.length?projects.map(p=>`<div class="project ${selected===p.name?'active':''}" onclick="selectProject('${esc(p.name)}')"><div class="project-name"><span class="dot ${statusClass(p)}"></span>${esc(p.name)}</div><div class="project-meta">${esc(p.repository)}</div><div class="project-meta">${esc(p.state||'IDLE')}</div></div>`).join(''):'<div class="empty">No projects yet.</div>'}
function render(){renderList();const p=projects.find(x=>x.name===selected);document.getElementById('startBtn').disabled=!p;document.getElementById('startBtn').textContent=p&&p.running?'■ Stop Supervisor':'▶ Start Supervisor';if(!p){document.getElementById('pageTitle').textContent='Lab OS';document.getElementById('pageRepo').textContent='Create or select a project';document.getElementById('content').innerHTML='<div class="empty">Create your first project to get started.</div>';return}
document.getElementById('pageTitle').textContent=p.name;document.getElementById('pageRepo').textContent=p.repository+' · '+p.project_root;
const sc=statusClass(p), state=p.running?'RUNNING':p.state||'IDLE';
document.getElementById('content').innerHTML=`
<div class="grid">
<section class="card hero"><div class="eyebrow">Project</div><div class="bigstate">${esc(state)}</div><span class="badge ${sc}">${p.ci_conclusion?'CI '+esc(p.ci_conclusion.toUpperCase()):'No recent CI result'}</span><p class="muted" style="margin-bottom:0">${esc(p.task_status)} · next: ${esc(p.next_action)}</p></section>
<section class="card statuscard"><h3>Repository</h3><div class="repo">${esc(p.repository)}</div><p><strong>Branch</strong><br>${esc(p.branch||'—')}</p><p><strong>HEAD</strong><br><code>${esc(p.commit?p.commit.slice(0,12):'—')}</code></p></section>
<section class="card wide"><h3>Run status</h3><div class="stats">
<div class="stat"><label>Supervisor</label><strong>${p.running?'Running':'Idle'}</strong></div>
<div class="stat"><label>CI run</label><strong>${esc(p.ci_run||'—')}</strong></div>
<div class="stat"><label>CI status</label><strong>${esc(p.ci_status||'—')}</strong></div>
<div class="stat"><label>Updated</label><strong>${esc(p.updated_at||'—')}</strong></div>
</div></section>
<section class="card wide"><h3>Project configuration</h3><div class="stats">
<div class="stat"><label>Local root</label><strong>${esc(p.project_root)}</strong></div>
<div class="stat"><label>ChatGPT Project</label><strong>${esc(p.project_name)}</strong></div>
<div class="stat"><label>CI stage</label><strong>${esc(p.ci_stage||'GitHub Actions')}</strong></div>
<div class="stat"><label>Conversation</label><strong>${p.conversation_url?'<a href="'+esc(p.conversation_url)+'" target="_blank" style="color:var(--accent)">Open chat ↗</a>':'—'}</strong></div>
</div></section>
</div>`}
async function refresh(){try{const r=await fetch('/api/projects',{cache:'no-store'});if(!r.ok)throw Error(await r.text());projects=(await r.json()).projects;if(!selected&&projects.length)selected=projects[0].name;if(selected&&!projects.some(p=>p.name===selected))selected=projects[0]?.name||null;render()}catch(e){document.getElementById('content').innerHTML='<div class="empty">API unavailable: '+esc(e.message)+'</div>'}}
function selectProject(n){selected=n;render()}
function openCreate(){document.getElementById('modal').classList.add('open')}
function closeCreate(){document.getElementById('modal').classList.remove('open')}
async function createProject(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const out=await r.json();if(!r.ok)throw Error(out.error||'Create failed');closeCreate();e.target.reset();selected=out.name;await refresh()}catch(err){alert(err.message)}}
async function toggleSupervisor(){const p=projects.find(x=>x.name===selected);if(!p)return;const action=p.running?'stop':'supervise';try{const r=await fetch('/api/projects/'+encodeURIComponent(p.name)+'/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({max_turns:0})});const out=await r.json();if(!r.ok)throw Error(out.error||'Supervisor action failed');await refresh()}catch(e){alert(e.message)}}
refresh();setInterval(refresh,4000);
</script>
</body>
</html>

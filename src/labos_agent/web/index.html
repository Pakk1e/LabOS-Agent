<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab OS</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f6f9;--surface:#fff;--surface2:#f8fafc;--surface3:#f1f5f9;
  --sidebar:#0b1220;--sidebar2:#111a2b;--border:#dbe2ea;--border2:#c4ced9;
  --text:#172033;--muted:#647084;--subtle:#8a95a6;
  --accent:#2563eb;--accent2:#1d4ed8;--good:#15803d;--warn:#a16207;--bad:#b42318;
  --shadow:0 8px 24px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html{min-width:320px}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 12px;transition:background .15s,border-color .15s,box-shadow .15s,transform .05s}
button:hover{border-color:var(--border2);background:var(--surface2)}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(37,99,235,.22);outline-offset:2px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
button.primary:hover{background:var(--accent2);border-color:var(--accent2)}
button.danger{color:var(--bad);border-color:#efc4c0;background:#fff}
button.danger:hover{background:#fff5f4}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,var(--sidebar),#0e1727);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto;color:#e8eef7}
.brand{font-size:18px;font-weight:850;margin:2px 9px 22px;letter-spacing:-.02em}
.brand small{display:block;color:#8d9bb0;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.side-section{color:#728099;font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:14px 9px 7px}
.project{padding:12px 10px;border-radius:9px;margin:4px 0;border:1px solid transparent;cursor:pointer}
.project:hover{background:rgba(255,255,255,.055)}
.project.active{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.13)}
.project-name{font-weight:700;display:flex;align-items:center;color:#f4f7fb}
.project-meta{color:#92a0b4;font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#64748b;margin-right:8px;flex:none}
.dot.good{background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.35)}
.dot.warn{background:#facc15}.dot.bad{background:#fb7185}
main{padding:28px 34px 52px;max-width:1540px;width:100%;margin:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}
.eyebrow{color:#718096;font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:750}
.title{font-size:30px;line-height:1.15;font-weight:850;letter-spacing:-.035em;margin:3px 0 5px}
.repo{color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center}
.actions button:first-child{min-width:38px}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow:auto}
.tab{border:0;background:transparent;border-radius:7px 7px 0 0;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{background:var(--surface3);color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:#edf4ff;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:14px}
.hero{grid-column:span 8}.status{grid-column:span 4}.wide{grid-column:span 12}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--surface2);padding:12px;border-radius:8px;border:1px solid var(--border);min-width:0}
.stat label{display:block;color:var(--subtle);font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.stat strong{display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;border:1px solid var(--border2);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;background:var(--surface2)}
.badge.good{color:var(--good);border-color:#b8e0c4;background:#f0faf3}
.badge.warn{color:var(--warn);border-color:#ead39a;background:#fff9e8}
.badge.bad{color:var(--bad);border-color:#efc4c0;background:#fff3f2}
.phase-track{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 0}
.phase{position:relative;text-align:center;padding:9px 4px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:#7a8799;font-size:9px;font-weight:750;letter-spacing:.03em}
.phase.done{color:#166534;border-color:#b8dec3;background:#f1faf4}
.phase.current{color:var(--accent);border-color:#9dbcf5;background:#eff5ff;box-shadow:inset 0 -2px 0 var(--accent)}
.phase.blocked{border-color:#e3c985;background:#fffaf0}
.phase small{display:block;font-weight:600;font-size:8px;margin-top:2px;color:inherit}
.gate{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:13px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);margin-top:12px}
.gate.ready{border-color:#b8dec3;background:#f5fbf6}.gate.blocked{border-color:#ead39a;background:#fffaf0}
.gate-title{font-weight:750}.gate-list{margin:5px 0 0;padding-left:18px;color:var(--muted);font-size:12px}
.response{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-height:280px;overflow:auto;color:#445066;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:13px}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--border)}
.table th{color:#78869a;font-size:10px;text-transform:uppercase;letter-spacing:.07em}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.empty{padding:34px;text-align:center;color:var(--muted)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.form{display:grid;gap:14px}.form label{display:grid;gap:6px;color:var(--muted);font-size:11px}
.form input,.form textarea,.form select{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px}
.form textarea{min-height:90px;resize:vertical}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dialog-section{padding:14px 0;border-top:1px solid var(--border);margin-top:4px}.dialog-section h4{margin:0 0 8px;color:var(--text)}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:5;backdrop-filter:blur(3px)}
.modal.open{display:flex}
.dialog{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--border2);border-radius:13px;padding:23px;box-shadow:0 24px 70px rgba(15,23,42,.22)}
.menu-button{display:none}
.danger-zone{border-color:#efc4c0;background:#fff9f8}
.hero-state{display:flex;align-items:center;justify-content:space-between;gap:12px}
.big{font-size:27px;font-weight:850;letter-spacing:-.025em;margin:3px 0}
.muted{color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.section-head h3{margin:0}
.timeline-item{display:grid;grid-template-columns:150px 150px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.timeline-item:last-child{border-bottom:0}
.toast-stack{position:fixed;right:18px;bottom:18px;z-index:20;display:grid;gap:8px;width:min(380px,calc(100vw - 36px))}
.toast{padding:12px 14px;border:1px solid var(--border2);border-radius:10px;background:var(--surface);box-shadow:0 12px 30px rgba(15,23,42,.14);font-size:13px}
.toast.good{border-color:#b8dec3}.toast.bad{border-color:#efc4c0}.toast.warn{border-color:#ead39a}
.overview-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.overview-hero{grid-column:span 8}.overview-repo{grid-column:span 4}
.lifecycle-summary{padding:17px 18px}
.lifecycle-summary .phase-track{margin-top:13px}
.state-banner{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px;border-radius:10px;border:1px solid var(--border);background:linear-gradient(135deg,#f8fbff,#fff)}
.state-banner.warn{border-color:#ead39a;background:#fffaf0}.state-banner.good{border-color:#b8dec3;background:#f5fbf6}.state-banner.bad{border-color:#efc4c0;background:#fff6f5}
.state-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:750}
.state-value{font-size:25px;font-weight:850;letter-spacing:-.02em;margin-top:2px}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media(max-width:1050px){main{padding:24px}.stats,.metric-grid{grid-template-columns:repeat(2,1fr)}.hero,.status,.overview-hero,.overview-repo{grid-column:span 12}}
@media(max-width:760px){.app{display:block}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid #253149;padding:12px}.side .brand{display:inline-block;margin:5px 8px 12px}.side .primary{width:auto!important;float:right;margin:0 4px 8px!important}.side-section{display:none}#projectList{clear:both;display:flex;overflow:auto;gap:4px}.project{min-width:170px}.top{align-items:flex-start}.title{font-size:23px}.phase-track{grid-template-columns:1fr 1fr}.grid,.overview-grid{display:block}.card{margin-bottom:12px}.stats,.metric-grid{grid-template-columns:1fr 1fr}main{padding:18px 14px 35px}.tabs{overflow:auto}.tab{white-space:nowrap}}
@media(max-width:460px){.stats,.metric-grid{grid-template-columns:1fr}.top .actions{align-items:flex-start}.top .actions button:first-child{display:none}.phase-track{grid-template-columns:1fr}.title{font-size:21px}}
</style></head>
<body>
<div class="app"><aside class="side"><div class="brand">LAB OS<small>Engineering control plane</small></div>
<button class="primary" style="width:100%;margin-bottom:14px" aria-label="Create new project" onclick="openCreate()">＋ New Project</button><div id="projectList"></div></aside>
<main><div class="top"><div><div class="eyebrow">Workspace</div><div class="title" id="pageTitle">Lab OS</div><div class="repo" id="pageRepo">Select a project</div></div>
<div class="actions"><button aria-label="Refresh project" title="Refresh" onclick="refresh()">↻</button><button id="startBtn" class="primary" onclick="toggleSupervisor()" disabled>▶ Start</button></div></div>
<nav id="tabs" class="tabs" aria-label="Project views"></nav><div id="content"><div class="empty">Loading…</div></div></main></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog" id="dialog"></div></div><div id="toastStack" class="toast-stack" aria-live="polite" aria-atomic="true"></div>
<script>
let projects=[],selected=null,view='overview',ciCache=[],jobsCache={};
let eventsSource=null,fallbackTimer=null,ciPollTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cls(p){if(p.ci_conclusion==='failure'||p.ci_status==='FAILED'||p.state==='FIX_CI')return'bad';if(p.running||['IN_PROGRESS','QUEUED'].includes(p.ci_status)||['WAIT_CI','CONTINUE'].includes(p.state))return'warn';if(p.ci_conclusion==='success'||p.ci_status==='PASSED')return'good';return''}
function renderList(){document.getElementById('projectList').innerHTML=projects.length?projects.map(p=>`<div class="project ${selected===p.name?'active':''}" onclick="selectProject('${esc(p.name)}')"><div class="project-name"><span class="dot ${cls(p)}"></span>${esc(p.name)}</div><div class="project-meta">${esc(p.repository)}</div><div class="project-meta">${esc(p.running?'RUNNING':p.state||'IDLE')}</div></div>`).join(''):'<div class="empty">No projects.</div>'}
function tabs(){return ['overview','lifecycle','documentation','planning','validation','runs','ci','repository','settings'].map(x=>`<button class="tab ${view===x?'active':''}" onclick="setView('${x}')">${x==='ci'?'CI / Actions':x[0].toUpperCase()+x.slice(1)}</button>`).join('')}
function render(){renderList();const p=projects.find(x=>x.name===selected);document.getElementById('tabs').innerHTML=p?tabs():'';updateProjectHeader(p);if(!p){document.getElementById('content').innerHTML='<div class="empty">Create or select a project.</div>';document.getElementById('content').dataset.ready='1';return}document.getElementById('content').innerHTML=page(p);document.getElementById('content').dataset.ready='1'}
function updateProjectHeader(p){const b=document.getElementById('startBtn');b.disabled=!p;b.textContent=p&&p.running?'■ Stop':'▶ Start';document.getElementById('pageTitle').textContent=p?.name||'Lab OS';document.getElementById('pageRepo').textContent=p?p.repository+' · '+p.project_root:'Select a project'}
function page(p){if(view==='lifecycle')return lifecyclePage(p);if(view==='documentation')return workspacePage('Documentation','/documentation',documentationView);if(view==='planning')return planningView(p);if(view==='validation')return workspacePage('Validation','/validation',validationView);if(view==='repository')return workspacePage('Repository assessment','/repository-assessment',repositoryView);if(view==='runs')return '<div class="card wide"><h3>Supervisor run history</h3><div id="runs"><div class="empty">Loading…</div></div></div>';if(view==='ci')return '<div class="card wide"><h3>GitHub Actions</h3><div id="ci"><div class="empty">Loading…</div></div></div>';if(view==='settings')return settings(p);return overview(p)}
function lifecycleControls(p){
 const phases=p.active_milestone_id?['PLANNING','DEVELOPMENT','VALIDATION','MAINTENANCE']:['IDEA','BRAINSTORM','DOCUMENTATION','PLANNING','DEVELOPMENT','VALIDATION','MAINTENANCE'];
 const i=phases.indexOf(p.lifecycle_phase),next=phases[i+1],gate=p.lifecycle_gate;
 const description={IDEA:'Capture the problem and intended outcome.',BRAINSTORM:'Explore the idea, constraints and alternatives.',DOCUMENTATION:'Turn the idea into durable product and engineering documentation.',PLANNING:'Create an implementation plan with explicit acceptance criteria.',DEVELOPMENT:'Implement the approved plan.',VALIDATION:'Validate the implementation against requirements and acceptance criteria.',MAINTENANCE:'Maintain the validated project.'}[p.lifecycle_phase];
 return `<section class="card wide">
 <div class="section-head"><div><div class="eyebrow">Lifecycle</div><h3>Where the project is now</h3></div><span class="badge ${p.lifecycle_phase==='DEVELOPMENT'&&!p.lifecycle_approved?'warn':p.lifecycle_phase==='MAINTENANCE'?'good':''}">${esc(p.lifecycle_phase)}</span></div>
 <div class="phase-track" aria-label="${p.active_milestone_id?'Current milestone lifecycle':'Project lifecycle'}">${phases.map((x,n)=>`<div class="phase ${n<i?'done':n===i?'current':''} ${gate?.target===x&&!gate?.satisfied?'blocked':''}" aria-current="${n===i?'step':'false'}">${n<i?'✓ ':''}${x}<small>${n===i?'Current':n<i?'Complete':n===i+1?'Next':'Later'}</small></div>`).join('')}</div>
 <div class="dialog-section"><div class="section-head"><div><h4>Milestones</h4><div class="hint">Each milestone runs its own Planning → Development → Validation → Maintenance cycle.</div></div><button onclick="openMilestoneDialog()">New milestone</button></div>
 \${p.milestones?.length ? \`<div class="table-wrap"><table class="table"><tr><th>Milestone</th><th>Phase</th><th>Objective</th><th></th></tr>\${p.milestones.map(m=>\`<tr><td><strong>\${esc(m.title)}</strong><div class="hint">\${esc(m.id)}</div></td><td><span class="badge \${m.complete?'good':m.active?'warn':''}">\${esc(m.phase)}\${m.active?' · Current':''}</span></td><td>\${esc(m.objective)}</td><td>\${m.complete&&!m.active?\`<button onclick="startMilestone('\${esc(m.id)}')">Start</button>\`:''}</td></tr>\`).join('')}</table></div>\` : \`<div class="empty">No milestones defined yet.</div>\`}
 </div>
 <div class="stats"><div class="stat"><label>Mode</label><strong>${esc(p.project_mode)}</strong></div><div class="stat"><label>Next phase</label><strong>${esc(next||'Complete')}</strong></div><div class="stat"><label>Approval</label><strong>${p.lifecycle_phase==='DEVELOPMENT'?(p.lifecycle_approved?'Approved':'Required'):'Not required'}</strong></div><div class="stat"><label>Supervisor</label><strong>${p.running?'Running':'Idle'}</strong></div></div>
 <div class="gate ${gate?.satisfied?'ready':'blocked'}"><div><div class="gate-title">${gate?.target?('Gate to '+esc(gate.target)):'Lifecycle complete'}</div><div class="hint">${esc(description)}</div>${gate?.missing?.length?`<ul class="gate-list">${gate.missing.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>`:gate?.target?'<div class="hint">Evidence is ready. You can advance.</div>':''}</div><div class="row-actions">${next&&gate?.satisfied&&p.manual_lifecycle_advance_enabled?`<button onclick="advanceLifecycle('${next}')">Advance</button>`:''}${p.lifecycle_phase==='DEVELOPMENT'&&!p.lifecycle_approved?'<button class="primary" onclick="approveDevelopment()">Approve development</button>':''}</div></div>
 <div class="dialog-section"><h4>Brainstorming notes</h4><p class="hint">Keep the reasoning that led to the documented project decision.</p><textarea id="brainstormNotes" aria-label="Brainstorming notes" style="width:100%;min-height:90px;margin-top:9px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:10px" placeholder="Goals, questions, constraints, alternatives…">${esc(p.brainstorm_notes||'')}</textarea><div class="row-actions" style="margin-top:8px"><button onclick="saveBrainstorm()">Save notes</button></div></div>
 </section>`;
}
function compactLifecycle(p){
 const phases=p.active_milestone_id?['PLANNING','DEVELOPMENT','VALIDATION','MAINTENANCE']:['IDEA','BRAINSTORM','DOCUMENTATION','PLANNING','DEVELOPMENT','VALIDATION','MAINTENANCE'];
 const i=phases.indexOf(p.lifecycle_phase),gate=p.lifecycle_gate;
 return `<section class="card wide lifecycle-summary">
   <div class="section-head"><div><div class="eyebrow">Project lifecycle</div><h3>Progress</h3></div><span class="badge ${p.lifecycle_phase==='MAINTENANCE'?'good':''}">${esc(p.lifecycle_phase)}</span></div>
   <div class="phase-track" aria-label="Project lifecycle">${phases.map((x,n)=>`<div class="phase ${n<i?'done':n===i?'current':''} ${gate?.target===x&&!gate?.satisfied?'blocked':''}" aria-current="${n===i?'step':'false'}">${n<i?'✓ ':''}${x}<small>${n===i?'Current':n<i?'Complete':n===i+1?'Next':'Later'}</small></div>`).join('')}</div>
   <div class="metric-grid">
     <div class="stat"><label>Next phase</label><strong>${esc(phases[i+1]||'Complete')}</strong></div>
     <div class="stat"><label>Mode</label><strong>${esc(p.project_mode||'—')}</strong></div>
     <div class="stat"><label>Approval</label><strong>${p.lifecycle_phase==='DEVELOPMENT'?(p.lifecycle_approved?'Approved':'Required'):'Not required'}</strong></div>
     <div class="stat"><label>Supervisor</label><strong>${p.running?'Running':'Idle'}</strong></div>
   </div>
 </section>`;
}
function operationalSummary(p){
 const state=p.running?'RUNNING':p.state||'IDLE';
 const map={
  IDLE:['Idle','The supervisor is not running.',''],
  RUNNING:['Running','The supervisor is actively working.','warn'],
  WAIT_CI:['Waiting for CI','Changes were pushed and the CI run is in progress. No action is required right now.','warn'],
  CONTINUE:['Continuing','The supervisor is continuing from the current project state.','warn'],
  FIX_CI:['CI needs attention','The latest CI result requires a fix before work can continue.','bad'],
  DONE:['Complete','The current task has finished.','good']
 };
 const x=map[state]||[state,'Supervisor state: '+state+'.',''];
 return {state,label:x[0],description:x[1],tone:x[2]};
}
function overview(p){
 const op=operationalSummary(p);
 return `<div class="overview-grid">
   <section class="card wide lifecycle-summary">
     <div class="section-head">
       <div><div class="eyebrow">Product lifecycle</div><h3>Where the project is in its development journey</h3></div>
       <button onclick="setView('lifecycle')">Open lifecycle</button>
     </div>
     ${compactLifecycle(p).replace('<section class="card wide lifecycle-summary">','').replace('</section>','')}
   </section>
   <section class="card overview-hero">
     <div class="state-banner ${op.tone}">
       <div>
         <div class="state-label">Supervisor execution</div>
         <div class="state-value">${esc(op.label)}</div>
         <div class="hint">${esc(op.description)}</div>
         <div class="mono muted" style="margin-top:7px">State: ${esc(op.state)}</div>
       </div>
       <div class="row-actions">
         <span class="badge ${cls(p)}">${p.ci_conclusion?'CI '+esc(p.ci_conclusion.toUpperCase()):'No recent CI'}</span>
       </div>
     </div>
     <div class="metric-grid">
       <div class="stat"><label>Task</label><strong>${esc(p.task_status||'—')}</strong></div>
       <div class="stat"><label>CI</label><strong>${esc(p.ci_status||'—')}</strong></div>
       <div class="stat"><label>Local tests</label><strong>${esc(p.analysis?.local_tests||'—')}</strong></div>
       <div class="stat"><label>Repository</label><strong>${esc(p.analysis?.commit_status||'—')}</strong></div>
     </div>
   </section>
   <section class="card overview-repo">
     <div class="eyebrow">Repository</div>
     <h3 style="margin:5px 0 8px">${esc(p.repository)}</h3>
     <p class="repo">Branch <strong>${esc(p.branch||'—')}</strong></p>
     <p class="repo">HEAD <span class="mono">${esc(p.commit||'—')}</span></p>
     <div class="row-actions" style="margin-top:14px"><button onclick="setView('repository')">View repository</button><button onclick="setView('ci')">View CI</button></div>
   </section>
   <section class="card wide">
     <div class="section-head"><div><h3>Live activity</h3><div class="hint">Most recent supervisor events</div></div><span class="muted">${esc(p.updated_at||'—')}</span></div>
     <div class="response">${p.recent_events?.length?p.recent_events.map(e=>esc((e.ts||'')+'  '+e.event+'  '+(e.state||e.summary||'')+'  '+(e.success===undefined?'':e.success))).join('\n'):'No supervisor events recorded yet.'}</div>
   </section>
   <section class="card wide">
     <div class="section-head"><div><h3>Latest agent state</h3><div class="hint">The current work item and recorded continuation state</div></div><span class="badge ${p.task_status==='DONE'?'good':p.state==='FIX_CI'?'bad':'warn'}">${esc(p.task_status||'UNKNOWN')}</span></div>
     <div class="metric-grid">
       <div class="stat"><label>Next action</label><strong>${esc(p.next_action||'—')}</strong></div>
       <div class="stat"><label>CI run</label><strong>${esc(p.ci_run||'—')}</strong></div>
       <div class="stat"><label>CI conclusion</label><strong>${esc(p.ci_conclusion||'—')}</strong></div>
       <div class="stat"><label>Updated</label><strong>${esc(p.updated_at||'—')}</strong></div>
     </div>
     <p class="response" style="margin-top:12px">${esc(p.last_response||'No response recorded yet.')}</p>
   </section>
 </div>`;
}
function workspacePage(title,path,renderer){return '<div class="card wide"><div class="section-head"><div><div class="eyebrow">Engineering workspace</div><h3>'+title+'</h3></div></div><div id="workspace" class="empty">Loading…</div></div>';}
function lifecyclePage(p){return '<div class="grid">'+lifecycleControls(p)+'<section class="card wide"><div class="section-head"><h3>Lifecycle history</h3><span class="muted">Auditable project transitions</span></div><div id="lifecycleHistory" class="timeline"><div class="empty">Loading…</div></div></section></div>';}
function documentationView(d){const rows=d.documents||[];return '<table class="table"><tr><th>Document</th><th>Status</th><th>Size</th></tr>'+rows.map(x=>'<tr><td class="mono">'+esc(x.name)+'</td><td><span class="badge '+(x.exists&&!x.placeholder?'good':'warn')+'">'+esc(!x.exists?'Missing':x.placeholder?'Needs work':'Present')+'</span></td><td>'+esc(String(x.bytes||0))+' bytes</td></tr>').join('')+'</table>'}
function planningView(p){return '<div class="grid"><section class="card wide"><div class="section-head"><h3>Planning evidence</h3><span class="badge '+(p.lifecycle_gate?.target==='DEVELOPMENT'&&p.lifecycle_gate?.satisfied?'good':'warn')+'">'+esc(p.lifecycle_gate?.target==='DEVELOPMENT'?(p.lifecycle_gate.satisfied?'Ready':'Blocked'):'Not current')+'</span></div><p class="hint">Planning is gated by requirements and an implementation plan containing explicit acceptance criteria.</p><ul class="gate-list">'+(p.lifecycle_gate?.missing?.length?p.lifecycle_gate.missing.map(x=>'<li>'+esc(x)+'</li>').join(''):'<li>Required planning evidence is present.</li>')+'</ul></section></div>'}
function validationView(d){const items=d.acceptance_criteria||[];return '<div class="stats"><div class="stat"><label>Validation report</label><strong>'+esc(d.exists?'Present':'Missing')+'</strong></div><div class="stat"><label>Passed</label><strong>'+d.passed+' / '+d.total+'</strong></div><div class="stat"><label>Report</label><strong class="mono">'+esc(d.path||'—')+'</strong></div></div><div style="margin-top:14px">'+(items.length?'<table class="table"><tr><th>Criterion</th><th>Result</th></tr>'+items.map(x=>'<tr><td class="mono">'+esc(x.id)+'</td><td><span class="badge '+(x.passed?'good':'bad')+'">'+(x.passed?'PASS':'NOT VERIFIED')+'</span></td></tr>').join('')+'</table>':'<div class="empty">No acceptance criteria found in the validation report.</div>')+'</div>'}
function repositoryView(d){return '<div class="stats"><div class="stat"><label>Git repository</label><strong>'+esc(d.git_repository?'Yes':'No')+'</strong></div><div class="stat"><label>Branch</label><strong>'+esc(d.branch||'—')+'</strong></div><div class="stat"><label>HEAD</label><strong class="mono">'+esc(d.head||'—')+'</strong></div><div class="stat"><label>Working tree</label><strong>'+esc(d.dirty===true?'Dirty':d.dirty===false?'Clean':'Unknown')+'</strong></div></div><p class="repo">'+esc(d.inspection_error||d.root||'No repository assessment recorded.')+'</p>'}
function settings(p){return `<div class="grid">
 <section class="card wide"><div class="eyebrow">Configuration</div><h3>Project settings</h3><p class="hint">Connection and ChatGPT project metadata. Lifecycle state is managed separately.</p><form class="form" onsubmit="saveProject(event)">
 <div class="stats"><label class="form">GitHub repository<input name="repository" value="${esc(p.repository)}" required></label><label class="form">Local repository path<input name="project_root" value="${esc(p.project_root)}" required></label></div>
 <div class="dialog-section"><h4>ChatGPT integration</h4><div class="stats"><label class="form">Project name<input name="project_name" value="${esc(p.project_name||'')}"></label><label class="form">Project URL<input name="project_url" value="${esc(p.project_url||'')}"></label><label class="form">New-chat selector<input name="new_chat_selector" value="${esc(p.new_chat_selector||'')}"></label><label class="form">CI stage<input name="ci_stage" value="${esc(p.ci_stage||'')}"></label></div></div>
 <div class="dialog-section"><h4>Supervisor</h4>\n <label class="form">Continuation message<textarea name="continuation_message">${esc(p.continuation_message||'')}</textarea></label>\n <div class="dialog-section"><h4>Timing & limits</h4><p class="hint">These values control how this project is paced and bounded. Changes apply to the next supervisor run.</p>\n <div class="stats">\n <label class="form">Max ChatGPT turns (0 = unlimited)<input name="max_turns" type="number" min="0" max="1000" step="1" value="${esc(p.max_turns??0)}"><span class="hint">Hard upper bound for one supervisor run.</span></label>\n <label class="form">Agent response timeout (seconds)<input name="response_timeout_seconds" type="number" min="30" max="3600" step="1" value="${esc(p.response_timeout_seconds??1200)}"></label>\n <label class="form">Quiet period after response (seconds)<input name="quiet_seconds" type="number" min="0" max="30" step="0.5" value="${esc(p.quiet_seconds??3)}"></label>\n <label class="form">Delay before next message (seconds)<input name="response_to_next_message_delay_seconds" type="number" min="0" max="600" step="1" value="${esc(p.response_to_next_message_delay_seconds??45)}"></label>\n <label class="form">Minimum fresh-chat delay (seconds)<input name="min_fresh_chat_delay_seconds" type="number" min="0" max="3600" step="1" value="${esc(p.min_fresh_chat_delay_seconds??420)}"></label>\n <label class="form">No-progress iteration limit<input name="max_no_progress_iterations" type="number" min="1" max="50" step="1" value="${esc(p.max_no_progress_iterations??5)}"></label>\n <label class="form">CI wait timeout (seconds)<input name="ci_timeout_seconds" type="number" min="60" max="7200" step="1" value="${esc(p.ci_timeout_seconds??1800)}"></label>\n <label class="form">CI polling interval (seconds)<input name="ci_poll_seconds" type="number" min="1" max="60" step="1" value="${esc(p.ci_poll_seconds??5)}"></label>\n </div></div>\n <label style="display:flex;align-items:flex-start;gap:10px;color:var(--text);font-size:13px;margin-top:12px">\n   <input type="checkbox" name="manual_lifecycle_advance_enabled" value="true" ${p.manual_lifecycle_advance_enabled!==false?'checked':''} style="width:auto;margin-top:3px">\n   <span><strong>Enable manual lifecycle advancement</strong><span class="hint" style="display:block">Show and allow the manual “Advance” action on the Lifecycle page. Automatic supervisor phase transitions are unaffected.</span></span>\n </label>\n </div>
 <div class="row-actions"><button type="submit" class="primary">Save changes</button><button type="button" onclick="refresh()">Discard</button></div></form></section>
 <section class="card wide danger-zone"><div class="eyebrow">Danger zone</div><h3>Archive project</h3><p class="hint">Removes the project from Lab OS configuration. Existing repository and state files are preserved.</p><button class="danger" onclick="archiveProject()">Archive project</button></section>
 </div>`}

async function loadRuns({silent=true}={}){const box=document.getElementById('runs');if(!box)return;try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/runs',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error);if(!d.runs?.length){box.innerHTML='<div class="empty">No completed supervisor runs recorded yet.</div>';return}box.innerHTML='<table class="table"><tr><th>Run</th><th>Started</th><th>Duration</th><th>Iterations</th><th>Result</th><th>Reason</th><th></th></tr>'+d.runs.map(x=>`<tr><td>#${x.run_number}</td><td>${esc(new Date(x.started_at).toLocaleString())}</td><td>${Math.round(x.duration_seconds||0)}s</td><td>${x.iterations?.length||0}</td><td><span class="badge ${x.result.includes('DONE')?'good':x.result==='STOPPED'?'warn':'bad'}">${esc(x.result)}</span></td><td>${esc(x.reason||'—')}</td><td><button onclick="showRun(${x.run_number})">Timeline</button></td></tr>`).join('')+'</table>'}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}

async function showRun(n){openDialog('<h3>Run #'+n+' timeline</h3><div id="runDetail" class="empty">Loading…</div><div class="dialog-actions"><button onclick="closeDialog()">Close</button></div>');try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/runs/'+n);const d=await r.json();if(!r.ok)throw Error(d.error);const events=d.events||[];document.getElementById('runDetail').innerHTML=events.length?events.map(e=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)"><span class="mono">${esc(new Date(e.ts).toLocaleTimeString())}</span> <strong>${esc(e.event)}</strong> <span class="muted">${esc(e.state||e.summary||e.success===undefined?'':String(e.state||e.summary||e.success))}</span></div>`).join(''):'No events recorded.'}catch(e){document.getElementById('runDetail').textContent=e.message}}

function scheduleCIPoll(runs, delay=10000){clearTimeout(ciPollTimer);ciPollTimer=null;if(view!=='ci'||!selected)return;const active=runs.some(x=>x.status&&x.status!=='completed'&&!x.conclusion);if(active)ciPollTimer=setTimeout(()=>loadCI({silent:true}),delay)}
async function loadCI({silent=true}={}){const box=document.getElementById('ci');if(!box)return;try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/ci',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error);ciCache=d.runs||[];box.innerHTML='<table class="table"><tr><th>Run</th><th>Workflow</th><th>Commit</th><th>Status</th><th>Conclusion</th><th></th></tr>'+ciCache.map(x=>`<tr><td>#${x.number}</td><td>${esc(x.name||x.displayTitle||'—')}</td><td class="mono">${esc((x.headSha||'').slice(0,12))}</td><td>${esc(x.status)}</td><td><span class="badge ${x.conclusion==='success'?'good':x.conclusion==='failure'?'bad':'warn'}">${esc(x.conclusion||x.status)}</span></td><td><button onclick="showJobs(${x.databaseId})">Jobs</button> <button onclick="ciAction(${x.databaseId},'rerun')">Rerun</button> ${x.status==='completed'?'<span class="row-actions"></span>':'<button class="danger" onclick="ciAction('+x.databaseId+',\'cancel\')">Cancel</button>'} <a href="${esc(x.url||'#')}" target="_blank"><button type="button">GitHub ↗</button></a></td></tr>`).join('')+'</table>';scheduleCIPoll(ciCache)}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>';scheduleCIPoll([{status:'active'}],30000)}}
function setView(v){clearTimeout(ciPollTimer);ciPollTimer=null;view=v;render();if(v==='runs')loadRuns({silent:false});if(v==='ci')loadCI({silent:false});if(v==='lifecycle')loadLifecycleHistory();if(['documentation','validation','repository'].includes(v))loadWorkspace(v)} 
async function loadLifecycleHistory(){const box=document.getElementById('lifecycleHistory');if(!box)return;try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/lifecycle-history',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);box.innerHTML=d.history.length?d.history.map(e=>'<div class="timeline-item"><span class="mono">'+esc(new Date(e.ts).toLocaleString())+'</span><strong>'+esc(e.event)+'</strong><span>'+esc((e.previous_phase?e.previous_phase+' → ':'')+e.phase+(e.approved?' · approved':''))+'</span></div>').join(''):'<div class="empty">No lifecycle history recorded yet.</div>'}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function loadWorkspace(v){const box=document.getElementById('workspace');if(!box)return;const paths={documentation:'documentation',validation:'validation',repository:'repository-assessment'};try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/'+paths[v],{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);box.innerHTML=v==='documentation'?documentationView(d):v==='validation'?validationView(d):repositoryView(d)}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function selectProject(n){clearTimeout(ciPollTimer);ciPollTimer=null;selected=n;view='overview';render()}
async function refresh(){try{const r=await fetch('/api/projects',{cache:'no-store'});if(!r.ok)throw Error(await r.text());const next=(await r.json()).projects;const previousSelected=selected;projects=next;if(!selected&&projects.length)selected=projects[0].name;if(selected&&!projects.some(p=>p.name===selected))selected=projects[0]?.name||null;const selectionChanged=selected!==previousSelected;const ready=document.getElementById('content').dataset.ready;if(selectionChanged||!ready){render();}else{render();}if(view==='runs')loadRuns({silent:false});if(view==='ci')loadCI({silent:false});if(view==='lifecycle')loadLifecycleHistory();if(['documentation','validation','repository'].includes(view))loadWorkspace(view);}catch(e){document.getElementById('content').innerHTML='<div class="empty">API unavailable: '+esc(e.message)+'</div>'}}
function connectEvents(){if(eventsSource)eventsSource.close();eventsSource=new EventSource('/api/events');eventsSource.addEventListener('connected',()=>{if(fallbackTimer){clearInterval(fallbackTimer);fallbackTimer=null}});eventsSource.addEventListener('project_changed',()=>refresh());eventsSource.onerror=()=>{if(!fallbackTimer)fallbackTimer=setInterval(refresh,60000)}}
function toast(message,type='good'){const stack=document.getElementById('toastStack');const item=document.createElement('div');item.className='toast '+type;item.textContent=message;stack.appendChild(item);setTimeout(()=>item.remove(),4500)}
function openDialog(html){document.getElementById('dialog').innerHTML=html;const title=document.getElementById('dialog').querySelector('h2,h3');if(title)title.id='dialogTitle';document.getElementById('modal').classList.add('open');document.getElementById('dialog').querySelector('input,textarea,select,button')?.focus()}
function closeDialog(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeDialog()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});
function openCreate(){openDialog(`<h2 style="margin-top:0">Create project</h2><p class="hint">Choose how much Lab OS should assume at the start. The lifecycle will enforce the appropriate next step.</p><form class="form" onsubmit="createProject(event)">
<label>Project name<input name="name" required placeholder="weather"></label><label>Initial idea<textarea name="initial_idea" required placeholder="What are you trying to build or improve?"></textarea></label>
<label>Project mode<select id="createMode" name="project_mode" onchange="updateCreateMode()"><option value="guided">Guided — start with brainstorming</option><option value="specification">Specification ready — start with documentation</option><option value="existing_repository">Existing repository — inspect first</option></select></label>
<div class="dialog-section"><h4>Repository</h4><label>GitHub repository<input name="repository" required placeholder="Pakk1e/VilaPro-Weather"></label><label>Local repository path<input name="project_root" required placeholder="/home/park-pro/VilaPro-Weather"></label><label id="createRepoCheck"><span><input name="create_repository" type="checkbox" value="true"> Create and clone a new GitHub repository</span></label><label id="visibilityField">Repository visibility<select name="repository_visibility"><option value="private">Private</option><option value="public">Public</option></select></label><p id="modeHint" class="hint">Guided projects begin in BRAINSTORM.</p></div>
<div class="dialog-section"><h4>ChatGPT Project</h4><p class="hint">Each LabOS project is bound to one ChatGPT Project. Open the ChatGPT Project, copy its URL, and provide it here so LabOS never starts work in another Project.</p><label>ChatGPT Project name<input name="project_name" required placeholder="Vadovsky Tech — Weather"></label><label>ChatGPT Project URL<input name="project_url" required placeholder="https://chatgpt.com/g/g-p-..."></label><label>Continuation message<textarea name="continuation_message" placeholder="Continue this project…"></textarea></div>
<div class="dialog-actions"><button type="button" onclick="closeDialog()">Cancel</button><button class="primary">Create project</button></div></form>`)}
async function saveBrainstorm(){try{const notes=document.getElementById('brainstormNotes')?.value||'';const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/lifecycle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brainstorm_notes:notes})}),d=await r.json();if(!r.ok)throw Error(d.error);await refresh()}catch(e){toast(e.message,'bad')}}
async function advanceLifecycle(phase){try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/lifecycle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phase})}),d=await r.json();if(!r.ok)throw Error(d.error);await refresh();toast('Lifecycle advanced.','good')}catch(e){toast(e.message,'bad')}}
async function approveDevelopment(){try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/lifecycle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved:true})}),d=await r.json();if(!r.ok)throw Error(d.error);await refresh()}catch(e){alert(e.message)}}
async function createProject(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),out=await r.json();if(!r.ok)throw Error(out.error);closeDialog();selected=out.name;await refresh()}catch(err){toast(err.message,'bad')}}
async function saveProject(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.manual_lifecycle_advance_enabled=e.target.elements.manual_lifecycle_advance_enabled?.checked===true;try{const r=await fetch('/api/projects/'+encodeURIComponent(selected),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),out=await r.json();if(!r.ok)throw Error(out.error);await refresh();toast('Project saved.')}catch(err){alert(err.message)}}
async function archiveProject(){if(!confirm('Archive '+selected+' from Lab OS configuration? Existing state files are preserved.'))return;try{const r=await fetch('/api/projects/'+encodeURIComponent(selected),{method:'DELETE'}),out=await r.json();if(!r.ok)throw Error(out.error);selected=null;await refresh()}catch(e){alert(e.message)}}
function openMilestoneDialog(){openDialog('<h3>New milestone</h3><form class="form" onsubmit="createMilestone(event)"><label>Milestone ID<input name="id" pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,63}" required></label><label>Title<input name="title" required></label><label>Objective<textarea name="objective" required></textarea></label><label>Agent instructions<textarea name="continuation_message" placeholder="Optional; defaults to the objective"></textarea></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="start" style="width:auto"> Start immediately</label><div class="dialog-actions"><button type="button" onclick="closeDialog()">Cancel</button><button class="primary">Create milestone</button></div></form>')}
async function createMilestone(e){e.preventDefault();const f=new FormData(e.target);const body={id:String(f.get('id')||''),title:String(f.get('title')||''),objective:String(f.get('objective')||''),continuation_message:String(f.get('continuation_message')||''),start:f.get('start')==='on'};try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/milestones',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error);closeDialog();await refresh();toast(body.start?'Milestone started.':'Milestone created.')}catch(err){alert(err.message)}}
async function startMilestone(id){if(!confirm('Start milestone '+id+'?'))return;try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/milestones/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}),d=await r.json();if(!r.ok)throw Error(d.error);await refresh();toast('Milestone started.')}catch(err){alert(err.message)}}
async function toggleSupervisor(){const p=projects.find(x=>x.name===selected);if(!p)return;if(p.running){try{const r=await fetch('/api/projects/'+encodeURIComponent(p.name)+'/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),d=await r.json();if(!r.ok)throw Error(d.error);await refresh()}catch(e){alert(e.message)}return}openDialog('<h3>Start Supervisor</h3><form class="form" onsubmit="startSupervisor(event)"><label>Maximum ChatGPT turns (0 = unlimited)<input name="max_turns" type="number" min="0" max="1000" value="'+esc(p.max_turns??0)+'"><span class="hint">Defaults to the project setting; change here for this run only.</span></label><div class="dialog-actions"><button type="button" onclick="closeDialog()">Cancel</button><button class="primary">Start</button></div></form>')}
async function startSupervisor(e){e.preventDefault();const max_turns=Number(new FormData(e.target).get('max_turns')||0);try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/supervise',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({max_turns})}),d=await r.json();if(!r.ok)throw Error(d.error);closeDialog();await refresh()}catch(err){alert(err.message)}}
function updateCreateMode(){const mode=document.getElementById('createMode')?.value;const check=document.getElementById('createRepoCheck');const vis=document.getElementById('visibilityField');const hint=document.getElementById('modeHint');if(!mode)return;const existing=mode==='existing_repository';check.style.display=existing?'none':'grid';vis.style.display=existing?'none':'grid';hint.textContent=existing?'Lab OS will inspect the existing Git repository and will not create or bootstrap project files.':mode==='specification'?'Start directly in DOCUMENTATION; your existing specification becomes the source for durable project docs.':'Start in BRAINSTORM and refine the idea before documentation.';}
refresh();connectEvents();
</script></body></html>

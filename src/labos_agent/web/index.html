<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab OS</title>
<style><style>
:root{color-scheme:dark;--bg:#080b10;--sidebar:#0c1118;--panel:#111821;--panel2:#171f2a;--panel3:#0d131b;--border:#263241;--border2:#344254;--text:#edf3f8;--muted:#8e9aaa;--accent:#7db0ff;--accent2:#a8c7ff;--good:#55d18a;--warn:#e6b95e;--bad:#ef727b;--shadow:0 14px 35px #0005}
*{box-sizing:border-box}html{min-width:320px}body{margin:0;background:radial-gradient(circle at 70% -10%,#18243a 0,#080b10 34%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:9px;padding:8px 12px;transition:.15s;border-color:var(--border)}button:hover{border-color:var(--border2);background:#1b2633}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button.primary{background:var(--accent);color:#06101e;border-color:var(--accent);font-weight:750}button.primary:hover{background:var(--accent2)}button.danger{color:var(--bad);border-color:#66313a}.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.side{border-right:1px solid var(--border);background:linear-gradient(180deg,#0d131b,#0a0f15);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:19px;font-weight:850;margin:0 9px 22px;letter-spacing:-.02em}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:550;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}.side-section{color:#657286;font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:15px 9px 6px}.project{padding:11px 10px;border-radius:10px;margin:3px 0;border:1px solid transparent;cursor:pointer}.project:hover{background:#121a24}.project.active{background:#18222f;border-color:#2c3949}.project-name{font-weight:700;display:flex;align-items:center}.project-meta{color:var(--muted);font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#596474;margin-right:8px;flex:none}.dot.good{background:var(--good);box-shadow:0 0 8px #55d18a55}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}main{padding:30px 36px 50px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}.eyebrow{color:#718096;font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}.title{font-size:29px;font-weight:850;letter-spacing:-.035em;margin:1px 0}.repo{color:var(--muted)}.actions{display:flex;gap:8px}.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px}.tab{border:0;background:transparent;border-radius:0;padding:10px 15px;color:var(--muted);border-bottom:2px solid transparent}.tab.active{color:var(--text);border-bottom-color:var(--accent);background:#111a25}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card{background:linear-gradient(180deg,#121a23,#101720);border:1px solid var(--border);border-radius:13px;padding:18px;box-shadow:0 5px 20px #0002}.card h3{margin:0 0 13px;font-size:14px}.hero{grid-column:span 8}.status{grid-column:span 4}.wide{grid-column:span 12}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:var(--panel3);padding:12px;border-radius:9px;border:1px solid #1c2632;min-width:0}.stat label{display:block;color:#78869a;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.stat strong{display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{display:inline-flex;align-items:center;border:1px solid var(--border2);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:650}.badge.good{color:var(--good);border-color:#245f3d;background:#102219}.badge.warn{color:var(--warn);border-color:#6d5422;background:#211b0e}.badge.bad{color:var(--bad);border-color:#673138;background:#241216}.phase-track{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0 16px}.phase{position:relative;text-align:center;padding:10px 4px 8px;border:1px solid var(--border);border-radius:8px;background:#0d131b;color:#748197;font-size:9px;font-weight:700;letter-spacing:.03em}.phase.done{color:#a8d7ba;border-color:#28533a;background:#102019}.phase.current{color:var(--text);border-color:var(--accent);background:#14233a;box-shadow:0 0 0 1px #7db0ff22}.phase.blocked{border-color:#614c25}.phase small{display:block;font-weight:500;font-size:8px;margin-top:2px;color:inherit}.gate{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px;border-radius:9px;background:#0d131b;border:1px solid var(--border);margin-top:12px}.gate.ready{border-color:#28533a}.gate.blocked{border-color:#614c25}.gate-title{font-weight:750}.gate-list{margin:5px 0 0;padding-left:18px;color:var(--muted);font-size:12px}.response{white-space:pre-wrap;max-height:280px;overflow:auto;color:#c8d1dc;background:#0b1017;border:1px solid #1b2530;border-radius:9px;padding:13px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #202936}.table th{color:#78869a;font-size:10px;text-transform:uppercase;letter-spacing:.07em}.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px}.empty{padding:34px;text-align:center;color:var(--muted)}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.form{display:grid;gap:14px}.form label{display:grid;gap:6px;color:var(--muted);font-size:11px}.form input,.form textarea,.form select{width:100%;background:#0b1017;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:10px}.form textarea{min-height:90px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.dialog-section{padding:12px 0;border-top:1px solid var(--border);margin-top:4px}.dialog-section h4{margin:0 0 8px;color:var(--text)}.hint{font-size:12px;color:var(--muted);margin:4px 0 0}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:5;backdrop-filter:blur(3px)}.modal.open{display:flex}.dialog{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--border2);border-radius:15px;padding:23px;box-shadow:var(--shadow)}.menu-button{display:none}.danger-zone{border-color:#5a3037;background:#191013}.hero-state{display:flex;align-items:center;justify-content:space-between;gap:12px}.big{font-size:25px;font-weight:850;letter-spacing:-.02em;margin:3px 0}.muted{color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.section-head h3{margin:0}.timeline-item{display:grid;grid-template-columns:130px 150px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #202936;font-size:12px}.timeline-item:last-child{border-bottom:0}
@media(max-width:1050px){main{padding:24px}.stats{grid-template-columns:repeat(2,1fr)}.hero,.status{grid-column:span 12}}
@media(max-width:760px){.app{display:block}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--border);padding:12px}.side .brand{display:inline-block;margin:5px 8px 12px}.side .primary{width:auto!important;float:right;margin:0 4px 8px!important}.side-section{display:none}#projectList{clear:both;display:flex;overflow:auto;gap:4px}.project{min-width:170px}.top{align-items:flex-start}.title{font-size:23px}.phase-track{grid-template-columns:1fr 1fr}.phase{font-size:10px}.grid{display:block}.card{margin-bottom:12px}.stats{grid-template-columns:1fr 1fr}main{padding:18px 14px 35px}.tabs{overflow:auto}.tab{white-space:nowrap}}
@media(max-width:460px){.stats{grid-template-columns:1fr}.top .actions{align-items:flex-start}.top .actions button:first-child{display:none}.phase-track{grid-template-columns:1fr}.title{font-size:21px}}
</style></style></head>
<body>
<div class="app"><aside class="side"><div class="brand">LAB OS<small>Engineering control plane</small></div>
<button class="primary" style="width:100%;margin-bottom:14px" aria-label="Create new project" onclick="openCreate()">＋ New Project</button><div id="projectList"></div></aside>
<main><div class="top"><div><div class="eyebrow">Workspace</div><div class="title" id="pageTitle">Lab OS</div><div class="repo" id="pageRepo">Select a project</div></div>
<div class="actions"><button aria-label="Refresh project" title="Refresh" onclick="refresh()">↻</button><button id="startBtn" class="primary" onclick="toggleSupervisor()" disabled>▶ Start</button></div></div>
<nav id="tabs" class="tabs" aria-label="Project views"></nav><div id="content"><div class="empty">Loading…</div></div></main></div>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script>
let projects=[],selected=null,view='overview',ciCache=[],jobsCache={};
let eventsSource=null,fallbackTimer=null,ciPollTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cls(p){if(p.ci_conclusion==='failure'||p.ci_status==='FAILED'||p.state==='FIX_CI')return'bad';if(p.running||['IN_PROGRESS','QUEUED'].includes(p.ci_status)||['WAIT_CI','CONTINUE'].includes(p.state))return'warn';if(p.ci_conclusion==='success'||p.ci_status==='PASSED')return'good';return''}
function renderList(){document.getElementById('projectList').innerHTML=projects.length?projects.map(p=>`<div class="project ${selected===p.name?'active':''}" onclick="selectProject('${esc(p.name)}')"><div class="project-name"><span class="dot ${cls(p)}"></span>${esc(p.name)}</div><div class="project-meta">${esc(p.repository)}</div><div class="project-meta">${esc(p.running?'RUNNING':p.state||'IDLE')}</div></div>`).join(''):'<div class="empty">No projects.</div>'}
function tabs(){return ['overview','runs','ci','settings'].map(x=>`<button class="tab ${view===x?'active':''}" onclick="setView('${x}')">${x==='ci'?'CI / Actions':x[0].toUpperCase()+x.slice(1)}</button>`).join('')}
function render(){renderList();const p=projects.find(x=>x.name===selected);document.getElementById('tabs').innerHTML=p?tabs():'';updateProjectHeader(p);if(!p){document.getElementById('content').innerHTML='<div class="empty">Create or select a project.</div>';document.getElementById('content').dataset.ready='1';return}document.getElementById('content').innerHTML=page(p);document.getElementById('content').dataset.ready='1'}
function updateProjectHeader(p){const b=document.getElementById('startBtn');b.disabled=!p;b.textContent=p&&p.running?'■ Stop':'▶ Start';document.getElementById('pageTitle').textContent=p?.name||'Lab OS';document.getElementById('pageRepo').textContent=p?p.repository+' · '+p.project_root:'Select a project'}
function page(p){if(view==='runs')return '<div class="card wide"><h3>Supervisor run history</h3><div id="runs"><div class="empty">Loading…</div></div></div>';if(view==='ci')return '<div class="card wide"><h3>GitHub Actions</h3><div id="ci"><div class="empty">Loading…</div></div></div>';if(view==='settings')return settings(p);return overview(p)}
function lifecycleControls(p){
 const phases=['IDEA','BRAINSTORM','DOCUMENTATION','PLANNING','DEVELOPMENT','VALIDATION','MAINTENANCE'];
 const i=phases.indexOf(p.lifecycle_phase),next=phases[i+1],gate=p.lifecycle_gate;
 const description={IDEA:'Capture the problem and intended outcome.',BRAINSTORM:'Explore the idea, constraints and alternatives.',DOCUMENTATION:'Turn the idea into durable product and engineering documentation.',PLANNING:'Create an implementation plan with explicit acceptance criteria.',DEVELOPMENT:'Implement the approved plan.',VALIDATION:'Validate the implementation against requirements and acceptance criteria.',MAINTENANCE:'Maintain the validated project.'}[p.lifecycle_phase];
 return `<section class="card wide">
 <div class="section-head"><div><div class="eyebrow">Lifecycle</div><h3>Where the project is now</h3></div><span class="badge ${p.lifecycle_phase==='DEVELOPMENT'&&!p.lifecycle_approved?'warn':p.lifecycle_phase==='MAINTENANCE'?'good':''}">${esc(p.lifecycle_phase)}</span></div>
 <div class="phase-track" aria-label="Project lifecycle">${phases.map((x,n)=>`<div class="phase ${n<i?'done':n===i?'current':''} ${gate?.target===x&&!gate?.satisfied?'blocked':''}" aria-current="${n===i?'step':'false'}">${n<i?'✓ ':''}${x}<small>${n===i?'Current':n<i?'Complete':n===i+1?'Next':'Later'}</small></div>`).join('')}</div>
 <div class="stats"><div class="stat"><label>Mode</label><strong>${esc(p.project_mode)}</strong></div><div class="stat"><label>Next phase</label><strong>${esc(next||'Complete')}</strong></div><div class="stat"><label>Approval</label><strong>${p.lifecycle_phase==='DEVELOPMENT'?(p.lifecycle_approved?'Approved':'Required'):'Not required'}</strong></div><div class="stat"><label>Supervisor</label><strong>${p.running?'Running':'Idle'}</strong></div></div>
 <div class="gate ${gate?.satisfied?'ready':'blocked'}"><div><div class="gate-title">${gate?.target?('Gate to '+esc(gate.target)):'Lifecycle complete'}</div><div class="hint">${esc(description)}</div>${gate?.missing?.length?`<ul class="gate-list">${gate.missing.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>`:gate?.target?'<div class="hint">Evidence is ready. You can advance.</div>':''}</div><div class="row-actions">${next&&gate?.satisfied?`<button onclick="advanceLifecycle('${next}')">Advance</button>`:''}${p.lifecycle_phase==='DEVELOPMENT'&&!p.lifecycle_approved?'<button class="primary" onclick="approveDevelopment()">Approve development</button>':''}</div></div>
 <div class="dialog-section"><h4>Brainstorming notes</h4><p class="hint">Keep the reasoning that led to the documented project decision.</p><textarea id="brainstormNotes" aria-label="Brainstorming notes" style="width:100%;min-height:90px;margin-top:9px;background:#0b1017;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:10px" placeholder="Goals, questions, constraints, alternatives…">${esc(p.brainstorm_notes||'')}</textarea><div class="row-actions" style="margin-top:8px"><button onclick="saveBrainstorm()">Save notes</button></div></div>
 </section>`;
}
function overview(p){const state=p.running?'RUNNING':p.state||'IDLE';return `<div class="grid">
 <section class="card hero"><div class="hero-state"><div><div class="eyebrow">Operational state</div><div class="big">${esc(state)}</div></div><span class="badge ${cls(p)}">${p.ci_conclusion?'CI '+esc(p.ci_conclusion.toUpperCase()):'No recent CI'}</span></div><p class="repo">${esc(p.task_status||'No task status')} · next action: <strong>${esc(p.next_action||'—')}</strong></p></section>
 <section class="card status"><div class="eyebrow">Repository</div><h3 style="margin-top:4px">${esc(p.repository)}</h3><p class="repo">Branch <strong>${esc(p.branch||'—')}</strong></p><p class="repo">HEAD <span class="mono">${esc(p.commit||'—')}</span></p></section>
 <section class="card wide"><div class="section-head"><h3>Operations</h3><span class="muted">Last update ${esc(p.updated_at||'—')}</span></div><div class="stats"><div class="stat"><label>Supervisor</label><strong>${p.running?'Running':'Idle'}</strong></div><div class="stat"><label>CI run</label><strong>${esc(p.ci_run||'—')}</strong></div><div class="stat"><label>CI status</label><strong>${esc(p.ci_status||'—')}</strong></div><div class="stat"><label>Commit status</label><strong>${esc(p.analysis?.commit_status||'—')}</strong></div></div></section>
 <section class="card wide"><div class="section-head"><h3>Live activity</h3><span class="muted">Most recent events</span></div><div class="response">${p.recent_events?.length?p.recent_events.map(e=>esc((e.ts||'')+'  '+e.event+'  '+(e.state||e.summary||'')+'  '+(e.success===undefined?'':e.success))).join('\\n'):'No supervisor events recorded yet.'}</div></section>
 <section class="card wide"><div class="section-head"><h3>Latest agent state</h3><span class="badge ${p.task_status==='DONE'?'good':p.state==='FIX_CI'?'bad':'warn'}">${esc(p.task_status||'UNKNOWN')}</span></div><div class="stats"><div class="stat"><label>Next action</label><strong>${esc(p.next_action||'—')}</strong></div><div class="stat"><label>Local tests</label><strong>${esc(p.analysis?.local_tests||'—')}</strong></div><div class="stat"><label>Commit status</label><strong>${esc(p.analysis?.commit_status||'—')}</strong></div><div class="stat"><label>CI conclusion</label><strong>${esc(p.ci_conclusion||'—')}</strong></div></div><p class="response" style="margin-top:12px">${esc(p.last_response||'No response recorded yet.')}</p></section>
 </div>`}

function settings(p){return `<div class="grid">
 <section class="card wide"><div class="eyebrow">Configuration</div><h3>Project settings</h3><p class="hint">Connection and ChatGPT project metadata. Lifecycle state is managed separately.</p><form class="form" onsubmit="saveProject(event)">
 <div class="stats"><label class="form">GitHub repository<input name="repository" value="${esc(p.repository)}" required></label><label class="form">Local repository path<input name="project_root" value="${esc(p.project_root)}" required></label></div>
 <div class="dialog-section"><h4>ChatGPT integration</h4><div class="stats"><label class="form">Project name<input name="project_name" value="${esc(p.project_name||'')}"></label><label class="form">Project URL<input name="project_url" value="${esc(p.project_url||'')}"></label><label class="form">New-chat selector<input name="new_chat_selector" value="${esc(p.new_chat_selector||'')}"></label><label class="form">CI stage<input name="ci_stage" value="${esc(p.ci_stage||'')}"></label></div></div>
 <div class="dialog-section"><h4>Supervisor</h4><label class="form">Continuation message<textarea name="continuation_message">${esc(p.continuation_message||'')}</textarea></label></div>
 <div class="row-actions"><button type="submit" class="primary">Save changes</button><button type="button" onclick="refresh()">Discard</button></div></form></section>
 <section class="card wide danger-zone"><div class="eyebrow">Danger zone</div><h3>Archive project</h3><p class="hint">Removes the project from Lab OS configuration. Existing repository and state files are preserved.</p><button class="danger" onclick="archiveProject()">Archive project</button></section>
 </div>`}

async function loadRuns({silent=true}={}){const box=document.getElementById('runs');if(!box)return;try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/runs',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error);if(!d.runs?.length){box.innerHTML='<div class="empty">No completed supervisor runs recorded yet.</div>';return}box.innerHTML='<table class="table"><tr><th>Run</th><th>Started</th><th>Duration</th><th>Iterations</th><th>Result</th><th>Reason</th><th></th></tr>'+d.runs.map(x=>`<tr><td>#${x.run_number}</td><td>${esc(new Date(x.started_at).toLocaleString())}</td><td>${Math.round(x.duration_seconds||0)}s</td><td>${x.iterations?.length||0}</td><td><span class="badge ${x.result.includes('DONE')?'good':x.result==='STOPPED'?'warn':'bad'}">${esc(x.result)}</span></td><td>${esc(x.reason||'—')}</td><td><button onclick="showRun(${x.run_number})">Timeline</button></td></tr>`).join('')+'</table>'}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}

async function showRun(n){openDialog('<h3>Run #'+n+' timeline</h3><div id="runDetail" class="empty">Loading…</div><div class="dialog-actions"><button onclick="closeDialog()">Close</button></div>');try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/runs/'+n);const d=await r.json();if(!r.ok)throw Error(d.error);const events=d.events||[];document.getElementById('runDetail').innerHTML=events.length?events.map(e=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)"><span class="mono">${esc(new Date(e.ts).toLocaleTimeString())}</span> <strong>${esc(e.event)}</strong> <span class="muted">${esc(e.state||e.summary||e.success===undefined?'':String(e.state||e.summary||e.success))}</span></div>`).join(''):'No events recorded.'}catch(e){document.getElementById('runDetail').textContent=e.message}}

function scheduleCIPoll(runs, delay=10000){clearTimeout(ciPollTimer);ciPollTimer=null;if(view!=='ci'||!selected)return;const active=runs.some(x=>x.status&&x.status!=='completed'&&!x.conclusion);if(active)ciPollTimer=setTimeout(()=>loadCI({silent:true}),delay)}
async function loadCI({silent=true}={}){const box=document.getElementById('ci');if(!box)return;try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/ci',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error);ciCache=d.runs||[];box.innerHTML='<table class="table"><tr><th>Run</th><th>Workflow</th><th>Commit</th><th>Status</th><th>Conclusion</th><th></th></tr>'+ciCache.map(x=>`<tr><td>#${x.number}</td><td>${esc(x.name||x.displayTitle||'—')}</td><td class="mono">${esc((x.headSha||'').slice(0,12))}</td><td>${esc(x.status)}</td><td><span class="badge ${x.conclusion==='success'?'good':x.conclusion==='failure'?'bad':'warn'}">${esc(x.conclusion||x.status)}</span></td><td><button onclick="showJobs(${x.databaseId})">Jobs</button> <button onclick="ciAction(${x.databaseId},'rerun')">Rerun</button> ${x.status==='completed'?'<span class="row-actions"></span>':'<button class="danger" onclick="ciAction('+x.databaseId+',\'cancel\')">Cancel</button>'} <a href="${esc(x.url||'#')}" target="_blank"><button type="button">GitHub ↗</button></a></td></tr>`).join('')+'</table>';scheduleCIPoll(ciCache)}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>';scheduleCIPoll([{status:'active'}],30000)}}
function setView(v){clearTimeout(ciPollTimer);ciPollTimer=null;view=v;render();if(v==='runs')loadRuns({silent:false});if(v==='ci')loadCI({silent:false})}
function selectProject(n){clearTimeout(ciPollTimer);ciPollTimer=null;selected=n;view='overview';render()}
async function refresh(){try{const r=await fetch('/api/projects',{cache:'no-store'});if(!r.ok)throw Error(await r.text());const next=(await r.json()).projects;const previousSelected=selected;projects=next;if(!selected&&projects.length)selected=projects[0].name;if(selected&&!projects.some(p=>p.name===selected))selected=projects[0]?.name||null;const selectionChanged=selected!==previousSelected;const ready=document.getElementById('content').dataset.ready;if(selectionChanged||!ready){render();if(view==='runs')loadRuns({silent:false});if(view==='ci')loadCI({silent:false});return}renderList();updateProjectHeader(projects.find(p=>p.name===selected));if(view==='overview'){document.getElementById('content').innerHTML=overview(projects.find(p=>p.name===selected));}else if(view==='runs')loadRuns();else if(view==='ci')loadCI();}catch(e){document.getElementById('content').innerHTML='<div class="empty">API unavailable: '+esc(e.message)+'</div>'}}
function connectEvents(){if(eventsSource)eventsSource.close();eventsSource=new EventSource('/api/events');eventsSource.addEventListener('connected',()=>{if(fallbackTimer){clearInterval(fallbackTimer);fallbackTimer=null}});eventsSource.addEventListener('project_changed',()=>refresh());eventsSource.onerror=()=>{if(!fallbackTimer)fallbackTimer=setInterval(refresh,60000)}}
function openDialog(html){document.getElementById('dialog').innerHTML=html;document.getElementById('modal').classList.add('open')}function closeDialog(){document.getElementById('modal').classList.remove('open')}
function openCreate(){openDialog(`<h2 style="margin-top:0">Create project</h2><p class="hint">Choose how much Lab OS should assume at the start. The lifecycle will enforce the appropriate next step.</p><form class="form" onsubmit="createProject(event)">
<label>Project name<input name="name" required placeholder="weather"></label><label>Initial idea<textarea name="initial_idea" required placeholder="What are you trying to build or improve?"></textarea></label>
<label>Project mode<select id="createMode" name="project_mode" onchange="updateCreateMode()"><option value="guided">Guided — start with brainstorming</option><option value="specification">Specification ready — start with documentation</option><option value="existing_repository">Existing repository — inspect first</option></select></label>
<div class="dialog-section"><h4>Repository</h4><label>GitHub repository<input name="repository" required placeholder="Pakk1e/VilaPro-Weather"></label><label>Local repository path<input name="project_root" required placeholder="/home/park-pro/VilaPro-Weather"></label><label id="createRepoCheck"><span><input name="create_repository" type="checkbox" value="true"> Create and clone a new GitHub repository</span></label><label id="visibilityField">Repository visibility<select name="repository_visibility"><option value="private">Private</option><option value="public">Public</option></select></label><p id="modeHint" class="hint">Guided projects begin in BRAINSTORM.</p></div>
<div class="dialog-section"><h4>Optional integration</h4><label>ChatGPT Project name<input name="project_name"></label><label>ChatGPT Project URL<input name="project_url"></label><label>Continuation message<textarea name="continuation_message" placeholder="Continue this project…"></textarea></label></div>
<div class="dialog-actions"><button type="button" onclick="closeDialog()">Cancel</button><button class="primary">Create project</button></div></form>`)}
async function saveBrainstorm(){try{const notes=document.getElementById('brainstormNotes')?.value||'';const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/lifecycle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brainstorm_notes:notes})}),d=await r.json();if(!r.ok)throw Error(d.error);await refresh()}catch(e){alert(e.message)}}
async function advanceLifecycle(phase){try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/lifecycle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phase})}),d=await r.json();if(!r.ok)throw Error(d.error);await refresh()}catch(e){alert(e.message)}}
async function approveDevelopment(){try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/lifecycle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved:true})}),d=await r.json();if(!r.ok)throw Error(d.error);await refresh()}catch(e){alert(e.message)}}
async function createProject(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),out=await r.json();if(!r.ok)throw Error(out.error);closeDialog();selected=out.name;await refresh()}catch(err){alert(err.message)}}
async function saveProject(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/projects/'+encodeURIComponent(selected),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),out=await r.json();if(!r.ok)throw Error(out.error);await refresh();alert('Project saved.')}catch(err){alert(err.message)}}
async function archiveProject(){if(!confirm('Archive '+selected+' from Lab OS configuration? Existing state files are preserved.'))return;try{const r=await fetch('/api/projects/'+encodeURIComponent(selected),{method:'DELETE'}),out=await r.json();if(!r.ok)throw Error(out.error);selected=null;await refresh()}catch(e){alert(e.message)}}
async function toggleSupervisor(){const p=projects.find(x=>x.name===selected);if(!p)return;if(p.running){try{const r=await fetch('/api/projects/'+encodeURIComponent(p.name)+'/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),d=await r.json();if(!r.ok)throw Error(d.error);await refresh()}catch(e){alert(e.message)}return}openDialog('<h3>Start Supervisor</h3><form class="form" onsubmit="startSupervisor(event)"><label>Maximum ChatGPT turns (0 = unlimited)<input name="max_turns" type="number" min="0" max="1000" value="0"></label><div class="dialog-actions"><button type="button" onclick="closeDialog()">Cancel</button><button class="primary">Start</button></div></form>')}
async function startSupervisor(e){e.preventDefault();const max_turns=Number(new FormData(e.target).get('max_turns')||0);try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/supervise',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({max_turns})}),d=await r.json();if(!r.ok)throw Error(d.error);closeDialog();await refresh()}catch(err){alert(err.message)}}
function updateCreateMode(){const mode=document.getElementById('createMode')?.value;const check=document.getElementById('createRepoCheck');const vis=document.getElementById('visibilityField');const hint=document.getElementById('modeHint');if(!mode)return;const existing=mode==='existing_repository';check.style.display=existing?'none':'grid';vis.style.display=existing?'none':'grid';hint.textContent=existing?'Lab OS will inspect the existing Git repository and will not create or bootstrap project files.':mode==='specification'?'Start directly in DOCUMENTATION; your existing specification becomes the source for durable project docs.':'Start in BRAINSTORM and refine the idea before documentation.';}
refresh();connectEvents();
</script></body></html>

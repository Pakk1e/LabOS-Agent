<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab OS</title>
<style>
:root{color-scheme:dark;--bg:#0a0d12;--panel:#111720;--panel2:#171e29;--border:#273241;--text:#edf2f7;--muted:#8d99a8;--accent:#8ab4ff;--good:#55d187;--warn:#e7b95b;--bad:#ef6b73}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 12px}button:hover{border-color:#465568}button.primary{background:var(--accent);color:#07101f;border-color:var(--accent);font-weight:700}button.danger{color:var(--bad);border-color:#66313a}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{border-right:1px solid var(--border);background:#0d1219;padding:22px 16px}.brand{font-size:20px;font-weight:800;margin:0 8px 25px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}.project{padding:12px;border-radius:10px;margin:5px 0;border:1px solid transparent}.project:hover{background:var(--panel)}.project.active{background:var(--panel2);border-color:var(--border)}.project-name{font-weight:700}.project-meta{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#596474;margin-right:7px}.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
main{padding:28px 34px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.eyebrow{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.09em}.title{font-size:28px;font-weight:800;margin:2px 0}.repo{color:var(--muted)}.actions{display:flex;gap:8px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px}.tab{border:0;background:transparent;border-radius:0;padding:11px 15px;color:var(--muted);border-bottom:2px solid transparent}.tab.active{color:var(--text);border-bottom-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:17px}.hero{grid-column:span 8}.status{grid-column:span 4}.wide{grid-column:span 12}.card h3{margin:0 0 13px}.big{font-size:24px;font-weight:800;margin:6px 0}.badge{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px 9px;font-size:12px}.badge.good{color:var(--good);border-color:#245f3d}.badge.warn{color:var(--warn);border-color:#6d5422}.badge.bad{color:var(--bad);border-color:#673138}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:var(--panel2);padding:11px;border-radius:8px;min-width:0}.stat label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.stat strong{display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #202936}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px}.empty{padding:30px;text-align:center;color:var(--muted)}.response{white-space:pre-wrap;max-height:280px;overflow:auto;color:#c8d1dc;background:#0b1017;border-radius:8px;padding:13px}.row-actions{display:flex;gap:6px}.job-step{margin-left:14px;color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.open{display:flex}.dialog{width:min(650px,100%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px}.form{display:grid;gap:12px}.form label{display:grid;gap:5px;color:var(--muted);font-size:12px}.form input,.form textarea,.form select{width:100%;background:#0b1017;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px}.form textarea{min-height:85px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.hero,.status,.wide{grid-column:span 12}.stats{grid-template-columns:repeat(2,1fr)}main{padding:18px}}
</style></head>
<body>
<div class="app"><aside class="side"><div class="brand">LAB OS<small>Engineering control plane</small></div>
<button class="primary" style="width:100%;margin-bottom:14px" onclick="openCreate()">＋ New Project</button><div id="projectList"></div></aside>
<main><div class="top"><div><div class="eyebrow">Workspace</div><div class="title" id="pageTitle">Lab OS</div><div class="repo" id="pageRepo">Select a project</div></div>
<div class="actions"><button onclick="refresh()">↻</button><button id="startBtn" class="primary" onclick="toggleSupervisor()" disabled>▶ Start</button></div></div>
<div id="tabs" class="tabs"></div><div id="content"><div class="empty">Loading…</div></div></main></div>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script>
let projects=[],selected=null,view='overview',ciCache=[],jobsCache={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cls(p){if(p.ci_conclusion==='failure'||p.ci_status==='FAILED'||p.state==='FIX_CI')return'bad';if(p.running||['IN_PROGRESS','QUEUED'].includes(p.ci_status)||['WAIT_CI','CONTINUE'].includes(p.state))return'warn';if(p.ci_conclusion==='success'||p.ci_status==='PASSED')return'good';return''}
function renderList(){document.getElementById('projectList').innerHTML=projects.length?projects.map(p=>`<div class="project ${selected===p.name?'active':''}" onclick="selectProject('${esc(p.name)}')"><div class="project-name"><span class="dot ${cls(p)}"></span>${esc(p.name)}</div><div class="project-meta">${esc(p.repository)}</div><div class="project-meta">${esc(p.running?'RUNNING':p.state||'IDLE')}</div></div>`).join(''):'<div class="empty">No projects.</div>'}
function tabs(){return ['overview','runs','ci','settings'].map(x=>`<button class="tab ${view===x?'active':''}" onclick="setView('${x}')">${x==='ci'?'CI / Actions':x[0].toUpperCase()+x.slice(1)}</button>`).join('')}
function render(){renderList();const p=projects.find(x=>x.name===selected);document.getElementById('tabs').innerHTML=p?tabs():'';const b=document.getElementById('startBtn');b.disabled=!p;b.textContent=p&&p.running?'■ Stop':'▶ Start';if(!p){document.getElementById('content').innerHTML='<div class="empty">Create or select a project.</div>';return}document.getElementById('pageTitle').textContent=p.name;document.getElementById('pageRepo').textContent=p.repository+' · '+p.project_root;document.getElementById('content').innerHTML=page(p)}
function page(p){if(view==='runs')return '<div class="card wide"><h3>Supervisor run history</h3><div id="runs"><div class="empty">Loading…</div></div></div>';if(view==='ci')return '<div class="card wide"><h3>GitHub Actions</h3><div id="ci"><div class="empty">Loading…</div></div></div>';if(view==='settings')return settings(p);return overview(p)}
function overview(p){return `<div class="grid"><section class="card hero"><div class="eyebrow">Current state</div><div class="big">${esc(p.running?'RUNNING':p.state||'IDLE')}</div><span class="badge ${cls(p)}">${p.ci_conclusion?'CI '+esc(p.ci_conclusion.toUpperCase()):'No recent CI'}</span><p class="repo">${esc(p.task_status)} · next: ${esc(p.next_action)}</p></section>
<section class="card status"><h3>Repository</h3><div class="repo">${esc(p.repository)}</div><p>Branch<br><strong>${esc(p.branch||'—')}</strong></p><p>HEAD<br><span class="mono">${esc(p.commit||'—')}</span></p></section>
<section class="card wide"><h3>Operations</h3><div class="stats"><div class="stat"><label>Supervisor</label><strong>${p.running?'Running':'Idle'}</strong></div><div class="stat"><label>CI run</label><strong>${esc(p.ci_run||'—')}</strong></div><div class="stat"><label>CI status</label><strong>${esc(p.ci_status||'—')}</strong></div><div class="stat"><label>Updated</label><strong>${esc(p.updated_at||'—')}</strong></div></div></section>
<section class="card wide"><h3>Live activity</h3><div class="response">${p.recent_events?.length?p.recent_events.map(e=>esc((e.ts||'')+'  '+e.event+'  '+(e.state||e.summary||'')+'  '+(e.success===undefined?'':e.success))).join('\\n'):'No supervisor events recorded yet.'}</div></section>
<section class="card wide"><h3>Latest ChatGPT state</h3><div class="stats"><div class="stat"><label>Next action</label><strong>${esc(p.next_action)}</strong></div><div class="stat"><label>Task</label><strong>${esc(p.task_status)}</strong></div><div class="stat"><label>Commit status</label><strong>${esc(p.analysis.commit_status||'—')}</strong></div><div class="stat"><label>Local tests</label><strong>${esc(p.analysis.local_tests||'—')}</strong></div></div><p class="response">${esc(p.last_response||'No response recorded yet.')}</p></section></div>`}
function settings(p){return `<div class="card wide"><h3>Project settings</h3><form class="form" onsubmit="saveProject(event)"><label>GitHub repository<input name="repository" value="${esc(p.repository)}" required></label><label>Local repository path<input name="project_root" value="${esc(p.project_root)}" required></label><label>ChatGPT Project name<input name="project_name" value="${esc(p.project_name)}"></label><label>ChatGPT Project URL<input name="project_url" value="${esc(p.project_url||'')}"></label><label>New-chat selector<input name="new_chat_selector" value="${esc(p.new_chat_selector||'')}"></label><label>Continuation message<textarea name="continuation_message">${esc(p.continuation_message||'')}</textarea></label><div class="row-actions"><button type="submit" class="primary">Save changes</button><button type="button" class="danger" onclick="archiveProject()">Archive project</button></div></form></div>`}
async function loadRuns(){const box=document.getElementById('runs');if(!box)return;try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/runs');const d=await r.json();if(!d.runs?.length){box.innerHTML='<div class="empty">No completed supervisor runs recorded yet.</div>';return}box.innerHTML='<table class="table"><tr><th>Run</th><th>Started</th><th>Duration</th><th>Iterations</th><th>Result</th><th>Reason</th><th></th></tr>'+d.runs.map(x=>`<tr><td>#${x.run_number}</td><td>${esc(new Date(x.started_at).toLocaleString())}</td><td>${Math.round(x.duration_seconds||0)}s</td><td>${x.iterations?.length||0}</td><td><span class="badge ${x.result.includes('DONE')?'good':x.result==='STOPPED'?'warn':'bad'}">${esc(x.result)}</span></td><td>${esc(x.reason||'—')}</td><td><button onclick="showRun(${x.run_number})">Timeline</button></td></tr>`).join('')+'</table>'}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function showRun(n){openDialog('<h3>Run #'+n+' timeline</h3><div id="runDetail" class="empty">Loading…</div><div class="dialog-actions"><button onclick="closeDialog()">Close</button></div>');try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/runs/'+n);const d=await r.json();if(!r.ok)throw Error(d.error);const events=d.events||[];document.getElementById('runDetail').innerHTML=events.length?events.map(e=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)"><span class="mono">${esc(new Date(e.ts).toLocaleTimeString())}</span> <strong>${esc(e.event)}</strong> <span class="muted">${esc(e.state||e.summary||e.success===undefined?'':String(e.state||e.summary||e.success))}</span></div>`).join(''):'No events recorded.'}catch(e){document.getElementById('runDetail').textContent=e.message}}\nasync function loadCI(){const box=document.getElementById('ci');if(!box)return;try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/ci');const d=await r.json();if(!r.ok)throw Error(d.error);ciCache=d.runs||[];box.innerHTML='<table class="table"><tr><th>Run</th><th>Workflow</th><th>Commit</th><th>Status</th><th>Conclusion</th><th></th></tr>'+ciCache.map(x=>`<tr><td>#${x.number}</td><td>${esc(x.name||x.displayTitle||'—')}</td><td class="mono">${esc((x.headSha||'').slice(0,12))}</td><td>${esc(x.status)}</td><td><span class="badge ${x.conclusion==='success'?'good':x.conclusion==='failure'?'bad':'warn'}">${esc(x.conclusion||x.status)}</span></td><td><button onclick="showJobs(${x.databaseId})">Jobs</button> <button onclick="ciAction(${x.databaseId},'rerun')">Rerun</button> <button class="danger" onclick="ciAction(${x.databaseId},'cancel')">Cancel</button> <a href="${esc(x.url||'#')}" target="_blank"><button type="button">GitHub ↗</button></a></td></tr>`).join('')+'</table>'}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function ciAction(id,action){if(!confirm((action==='cancel'?'Cancel':'Rerun')+' CI run #'+id+'?'))return;try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/ci/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})}),d=await r.json();if(!r.ok)throw Error(d.error);await loadCI();await refresh()}catch(e){alert(e.message)}}
async function showJobs(id){const p=selected;openDialog('<h3>Workflow jobs</h3><div id="jobs" class="empty">Loading…</div><div class="dialog-actions"><button onclick="closeDialog()">Close</button></div>');try{const r=await fetch('/api/projects/'+encodeURIComponent(p)+'/ci/'+id);const d=await r.json();document.getElementById('jobs').innerHTML=(d.jobs||[]).map(j=>`<div style="padding:9px 0;border-bottom:1px solid var(--border)"><strong>${esc(j.name)}</strong> <span class="badge ${j.conclusion==='success'?'good':j.conclusion==='failure'?'bad':'warn'}">${esc(j.conclusion||j.status)}</span>${(j.steps||[]).map(s=>`<div class="job-step">• ${esc(s.name)} — ${esc(s.conclusion||s.status||'')}</div>`).join('')}</div>`).join('')||'No jobs returned.'}catch(e){document.getElementById('jobs').textContent=e.message}}
function setView(v){view=v;render();if(v==='runs')loadRuns();if(v==='ci')loadCI()}
function selectProject(n){selected=n;view='overview';render()}
async function refresh(){try{const r=await fetch('/api/projects',{cache:'no-store'});if(!r.ok)throw Error(await r.text());projects=(await r.json()).projects;if(!selected&&projects.length)selected=projects[0].name;if(selected&&!projects.some(p=>p.name===selected))selected=projects[0]?.name||null;render();if(view==='runs')loadRuns();if(view==='ci')loadCI()}catch(e){document.getElementById('content').innerHTML='<div class="empty">API unavailable: '+esc(e.message)+'</div>'}}
function openDialog(html){document.getElementById('dialog').innerHTML=html;document.getElementById('modal').classList.add('open')}function closeDialog(){document.getElementById('modal').classList.remove('open')}
function openCreate(){openDialog('<h2 style="margin-top:0">Create Project</h2><form class="form" onsubmit="createProject(event)"><label>Name<input name="name" required placeholder="weather"></label><label>GitHub repository<input name="repository" required placeholder="Pakk1e/VilaPro-Weather"></label><label>Local repository path<input name="project_root" required placeholder="/home/park-pro/VilaPro-Weather"></label><label>ChatGPT Project name<input name="project_name"></label><label>ChatGPT Project URL<input name="project_url"></label><label>Continuation message<textarea name="continuation_message"></textarea></label><div class="dialog-actions"><button type="button" onclick="closeDialog()">Cancel</button><button class="primary">Create</button></div></form>')}
async function createProject(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),out=await r.json();if(!r.ok)throw Error(out.error);closeDialog();selected=out.name;await refresh()}catch(err){alert(err.message)}}
async function saveProject(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/projects/'+encodeURIComponent(selected),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),out=await r.json();if(!r.ok)throw Error(out.error);await refresh();alert('Project saved.')}catch(err){alert(err.message)}}
async function archiveProject(){if(!confirm('Archive '+selected+' from Lab OS configuration? Existing state files are preserved.'))return;try{const r=await fetch('/api/projects/'+encodeURIComponent(selected),{method:'DELETE'}),out=await r.json();if(!r.ok)throw Error(out.error);selected=null;await refresh()}catch(e){alert(e.message)}}
async function toggleSupervisor(){const p=projects.find(x=>x.name===selected);if(!p)return;if(p.running){try{const r=await fetch('/api/projects/'+encodeURIComponent(p.name)+'/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),d=await r.json();if(!r.ok)throw Error(d.error);await refresh()}catch(e){alert(e.message)}return}openDialog('<h3>Start Supervisor</h3><form class="form" onsubmit="startSupervisor(event)"><label>Maximum ChatGPT turns (0 = unlimited)<input name="max_turns" type="number" min="0" max="1000" value="0"></label><div class="dialog-actions"><button type="button" onclick="closeDialog()">Cancel</button><button class="primary">Start</button></div></form>')}
async function startSupervisor(e){e.preventDefault();const max_turns=Number(new FormData(e.target).get('max_turns')||0);try{const r=await fetch('/api/projects/'+encodeURIComponent(selected)+'/supervise',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({max_turns})}),d=await r.json();if(!r.ok)throw Error(d.error);closeDialog();await refresh()}catch(err){alert(err.message)}}
refresh();setInterval(refresh,4000);
</script></body></html>

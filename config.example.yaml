# Copy to config.yaml for local use. Never commit config.yaml if it contains machine-specific values.

browser:
  cdp_url: "http://127.0.0.1:9222"
  profile_dir: "/home/park-pro/LabOS-Agent/browser-profile"
  response_timeout_seconds: 300
  quiet_seconds: 3

projects:
  weather:
    repository: "Pakk1e/VilaPro-Weather"
    project_root: "/home/park-pro/VilaPro/VilaPro-Weather"
    continuation_message: "Continue Weather"
    # These identify the ChatGPT Project used for the Weather development chats.
    # Set them before enabling rollover/autonomous mode.
    project_name: "REPLACE_WITH_CHATGPT_PROJECT_NAME"
    # Current ChatGPT UI exposes the Project home through the visible
    # "Open project home" button. Leave this empty unless a different,
    # independently verified UI action is required.
    new_chat_selector: ""
    rollover_after_iterations: 20
    rollover_after_response_chars: 120000

# Copy to config.yaml for local use. Never commit config.yaml if it contains machine-specific values.

browser:
  cdp_url: "http://127.0.0.1:9222"
  profile_dir: "/path/to/LabOS-Agent/browser-profile"
  response_timeout_seconds: 300
  quiet_seconds: 3

projects:
  weather:
    repository: "Pakk1e/VilaPro-Weather"
    project_root: "/path/to/VilaPro-Weather"
    continuation_message: "Continue Weather"
    project_name: "Vadovsky Tech — Weather"
    project_url: "https://chatgpt.com/g/g-p-example/vadovsky-tech-weather/project"
    new_chat_selector: ""
    execution:
      enabled: false
      allowed_roots:
        - "/home/park-pro/VilaPro-Weather"
      command_timeout_seconds: 300
    rollover_after_iterations: 20
    rollover_after_response_chars: 120000
    # CI commands are trusted project configuration. Each command is an argv list;
    # LocalCI never passes these through a shell.
    ci_timeout_seconds: 1800
    ci_stage: "test"
    ci:
      test:
        - ["python3", "-m", "pytest"]

  # Example for another project. The project can live anywhere on the Lab OS host.
